[tools]
bun = "1.4.2"

[settings]
experimental = true
pin = true

[hooks]
postinstall = "bun install"

[env]
_.path = "node_modules/.bin"

[tasks.typecheck]
run = "bun run typecheck"

[tasks.lint]
run = "bun run lint"

[tasks.format]
run = "bun run format"

[tasks.test]
run = "bun run test"

[tasks.format-check]
run = "bun run format:check"

[tasks.eval]
description = "Evals of every LLM call against Workers AI; arguments pass through"
run = "bun run eval"

[tasks.check]
description = "Every check, the evals included, after the fast ones pass"
depends = ["typecheck", "lint", "test", "format-check"]
run = "bun run eval"

[tasks."dev:entity-store"]
description = "Link entity-store's local state, so dev binds the entity-store its own `alchemy dev` serves"
run = "bun scripts/link-entity-store.ts"

[tasks.dev]
depends = ["dev:entity-store"]
run = "bun run dev"

[tasks.deploy]
run = "bun run deploy --stage prod"

[tasks."demo:reset"]
description = "Reset the local studio from `mise run dev` to the demo's known state"
run = "bun demo/reset.ts"

[tasks.slides]
description = "Open the demo's slide deck in the browser"
run = "open docs/demo/deck/index.html"
