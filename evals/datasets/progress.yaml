# yaml-language-server: $schema=./progress.schema.json
# Each input is reasoning written the way the planner reasons. Each case accepts the phrases a
# person would find accurate.
cases:
  understanding:
    input: >-
      The person says they want something to happen 'when new people join'. Do they mean employees
      or contractors? They mention a start date and a manager, which are employee fields, so this is
      about employee records. They haven't said what should happen first.
    checks:
      picks understanding: { phrase: understanding }
  planning:
    input: >-
      So the steps are: wait until the start date, then send the welcome email, then post the
      heads-up to the manager. The welcome should come after the wait. Three top-level steps: wait,
      welcome, heads_up.
    checks:
      picks planning: { phrase: planning }
  timing:
    input: >-
      The reminder should go three days before the start date, so a wait until employee.start_date
      with offset -3 days. For the weekly one, the cron is 0 9 * * 1 in Europe/London.
    checks:
      picks timing: { phrase: timing }
  people:
    input: >-
      Who approves the email? Anything sent to new hires should wait for someone to approve it, so
      email.send should ask first. The manager needs to confirm the meeting time, so a human step
      assigned to employee.manager, notified on Slack.
    checks:
      picks people: { phrase: people }
  paths:
    input: >-
      Engineers and everyone else need different handling. Should this be an if step on
      employee.role, or a decide step, since roles are free text like 'Senior Backend Developer'? If
      no case matches, the otherwise branch should still run something.
    checks:
      picks paths: { phrase: paths }
  connections:
    input: >-
      They want the new hire's record sent to their HR system. That's http.post to a webhook, but I
      don't know the URL and must not invent one. The body can default to the subject.
    checks:
      picks connections: { phrase: connections }
  messages:
    input: >-
      There's a welcome_engineer template and a welcome_general one. The engineering one fits
      engineers; the general one fits everyone else. I'll fill the hire slot with {{employee}} and
      match on employee.role to choose between them.
    checks:
      picks messages: { phrase: messages }
  checking:
    input: >-
      check_workflow says steps.notify reads steps.approve, which might not have run on every path.
      I need to move notify inside the approved branch, then check again.
    checks:
      picks checking: { phrase: checking }
  timing-or-planning:
    input: >-
      After the meeting is booked, wait two days and then follow up on Slack. That adds a wait step
      of 2 days and a follow-up step at the end.
    checks:
      picks timing or planning: { phrase: { $oneOf: [timing, planning] } }
  understanding-team:
    input: >-
      They said 'notify the team', but which team? Earlier they mentioned the sales team's Slack
      channel, so probably #sales. They haven't said whether contractors count too.
    checks:
      picks understanding: { phrase: understanding }
  planning-order:
    input: >-
      First create the account, then send the welcome email, and only after both are done tell the
      manager. The account and the email can run side by side in a parallel step, with the
      manager's message after it.
    checks:
      picks planning: { phrase: planning }
  paths-threshold:
    input: >-
      If the contract is worth more than 50,000 a year, legal needs a full review; otherwise a light
      review is enough. That's an if step with one case on contract.value and an otherwise.
    checks:
      picks paths: { phrase: paths }
  connections-url:
    input: >-
      Send the order to their fulfilment API with http.post. The URL they gave is
      https://api.example.com/orders, which is public HTTPS, so it's allowed. The body is the order
      record.
    checks:
      picks connections: { phrase: connections }
  messages-wording:
    input: >-
      There's no template for reminders, so the agent step writes it. It should be short and
      friendly, use the employee's first name, and mention the start date and where to go on day
      one.
    checks:
      picks messages: { phrase: messages }
  checking-permission:
    input: >-
      The check reports that email.send has no permission. Anything sent to people should wait for
      approval, so I'll set it to ask and run the check again.
    checks:
      picks checking or people: { phrase: { $oneOf: [checking, people] } }
  people-or-messages:
    input: >-
      The manager should get the heads-up, not the new hire. The manager_heads_up template is for
      that, sent to {{employee.manager}} on Slack.
    checks:
      picks people or messages: { phrase: { $oneOf: [people, messages] } }
