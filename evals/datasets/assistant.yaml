# yaml-language-server: $schema=./assistant.schema.json
# The assistant runs over the fixture studio in src/assistant/fixtures.ts. `approve` is how the
# person answers every confirmation it asks for.
cases:
  template-then-draft:
    input:
      message: >-
        Create an onboarding email template named onboarding_email with description 'Welcome new
        employees', subject Welcome and body 'Glad you are here'. No slots needed. Then draft a
        manual automation that emails employee sam@example.com using onboarding_email. Do not save
        or start it.
      approve: true
    checks:
      creates the requested template:
        changes:
          $includes:
            - $includes:
                kind: putTemplate
                template:
                  $includes:
                    name: onboarding_email
                    description: Welcome new employees
      passes exact template name to planner:
        delegated: onboarding_email
      planner uses template:
        templatesUsed:
          $includes: [onboarding_email]
      activities complete from outcomes:
        activities: { status: completed, atLeast: 2 }

  cancellation:
    input:
      message: >-
        Create a template named simple_welcome, description 'A friendly greeting', subject Welcome,
        body Hello, no slots. If I cancel do not try again.
      approve: false
    checks:
      does not write after cancellation:
        changes: []
      reports cancellation:
        activities: { status: cancelled, atLeast: 1 }

  # The person has an automation open and asks to change it: the assistant edits that draft
  # through the planner instead of creating another automation.
  edit-open-automation:
    input:
      message: >-
        After the welcome email, also post in #people-ops on Slack that they started. Don't save
        it.
      approve: true
      context: { pathname: /, automationId: welcome-new-hires }
      existing:
        id: welcome-new-hires
        name: Welcome new hires
        draft:
          name: Welcome new hires
          trigger: { kind: entity, entity: employee }
          steps:
            - id: welcome
              title: Email the new hire
              kind: action
              use: email.send
              with: { to: "{{employee}}", subject: Welcome, body: Glad you're here }
          permissions: { email.send: auto }
    checks:
      edits the open automation instead of creating one:
        drafted: [welcome-new-hires]
      the draft posts to Slack:
        operationsUsed:
          $includes: [slack.sendMessage]

  # New automations are created only through the assistant, which drafts one through the planner.
  new-automation:
    input:
      message: Draft a manual automation that posts a hello to #general on Slack. Don't save it.
      approve: true
      context: { pathname: / }
    checks:
      creates one new automation:
        drafted: [{ $matches: "/^(?!welcome-new-hires$)[a-z0-9-]+$/" }]
      doesn't change entities or templates:
        changes: []

  # The request that once failed: the planner wrote its questions in its reply and drafted
  # nothing, and the assistant reported a failure instead of relaying them. Whether the planner
  # drafts or only asks, the hand-off completes.
  onboarding-asks-before-drafting:
    input:
      message: >-
        When someone new joins, welcome them on Slack, send them our welcome email, and book thirty
        minutes with their manager. After three days, check-in on them and see how it's going.
      approve: true
      context: { pathname: / }
    checks:
      # It may follow up on the planner's questions, in the same automation.
      creates one new automation:
        automations: 1
      the hand-off completes:
        activities: { status: completed, atLeast: 1 }
